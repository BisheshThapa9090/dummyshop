name: pixelmart
description: A multi-module Flutter shopping app consuming DummyJSON API
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0

  # Navigation
  go_router: ^12.0.0

  # State Management
  provider: ^6.1.0

  # Local Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Images
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0

  # Animations
  lottie: ^2.7.0

  # Forms
  flutter_form_builder: ^9.1.0

  # Utilities
  equatable: ^2.0.5
  get_it: ^7.6.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/splash.json
    - assets/images/
    - assets/images/Pixel_Mart.png

# ============================================
# APP ICON CONFIGURATION
# ============================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Pixel_Mart.png"
  adaptive_icon_background: "#3A4CF0"
  adaptive_icon_foreground: "assets/images/Pixel_Mart.png"
  remove_alpha_ios: true